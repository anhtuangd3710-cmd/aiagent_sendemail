<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Email AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
        }

        .auth-tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #6b7280;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .auth-tab:hover {
            color: #667eea;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .auth-form {
            padding: 30px;
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert.show {
            display: block;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .password-strength .bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-bottom: 4px;
            overflow: hidden;
        }

        .password-strength .bar-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
        }

        .password-strength .bar-fill.weak { width: 33%; background: #ef4444; }
        .password-strength .bar-fill.medium { width: 66%; background: #f59e0b; }
        .password-strength .bar-fill.strong { width: 100%; background: #22c55e; }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .password-requirements li {
            margin: 4px 0;
            padding-left: 20px;
            position: relative;
        }

        .password-requirements li::before {
            content: '○';
            position: absolute;
            left: 0;
            color: #9ca3af;
        }

        .password-requirements li.valid::before {
            content: '✓';
            color: #22c55e;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #9ca3af;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 15px;
        }

        .skip-login {
            text-align: center;
        }

        .skip-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .skip-login a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                border-radius: 0;
            }
            
            .auth-header {
                padding: 30px 20px;
            }
            
            .auth-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">📧</div>
            <h1>Email AI Agent</h1>
            <p>Tự động hóa email với trí tuệ nhân tạo</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Đăng nhập</div>
            <div class="auth-tab" data-tab="register">Đăng ký</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="alert error" id="loginError"></div>
            <div class="alert success" id="loginSuccess"></div>

            <div class="form-group">
                <label for="loginUsername">Tên đăng nhập hoặc Email</label>
                <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập hoặc email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">
                Đăng nhập
            </button>

            <div class="divider"><span>hoặc</span></div>

            <div class="skip-login">
                <a href="/">Tiếp tục không cần đăng nhập →</a>
            </div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="auth-form">
            <div class="alert error" id="registerError"></div>
            <div class="alert success" id="registerSuccess"></div>

            <div class="form-group">
                <label for="registerFullName">Họ và tên</label>
                <input type="text" id="registerFullName" placeholder="Nhập họ và tên">
            </div>

            <div class="form-group">
                <label for="registerUsername">Tên đăng nhập *</label>
                <input type="text" id="registerUsername" placeholder="Tối thiểu 3 ký tự" required minlength="3">
            </div>

            <div class="form-group">
                <label for="registerEmail">Email *</label>
                <input type="email" id="registerEmail" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="registerPassword">Mật khẩu *</label>
                <input type="password" id="registerPassword" placeholder="Tối thiểu 8 ký tự" required minlength="8">
                <div class="password-strength">
                    <div class="bar"><div class="bar-fill" id="passwordStrengthBar"></div></div>
                    <span id="passwordStrengthText"></span>
                </div>
                <ul class="password-requirements" id="passwordRequirements">
                    <li data-req="length">Tối thiểu 8 ký tự</li>
                    <li data-req="upper">Có ít nhất 1 chữ hoa</li>
                    <li data-req="lower">Có ít nhất 1 chữ thường</li>
                    <li data-req="number">Có ít nhất 1 số</li>
                </ul>
            </div>

            <div class="form-group">
                <label for="registerConfirmPassword">Xác nhận mật khẩu *</label>
                <input type="password" id="registerConfirmPassword" placeholder="Nhập lại mật khẩu" required>
            </div>

            <button type="submit" class="submit-btn" id="registerBtn">
                Đăng ký
            </button>
        </form>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                const formId = tab.dataset.tab === 'login' ? 'loginForm' : 'registerForm';
                document.getElementById(formId).classList.add('active');
                
                // Clear alerts
                hideAllAlerts();
            });
        });

        function hideAllAlerts() {
            document.querySelectorAll('.alert').forEach(a => a.classList.remove('show'));
        }

        function showAlert(elementId, message) {
            hideAllAlerts();
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.classList.add('show');
        }

        // Password strength checker
        document.getElementById('registerPassword').addEventListener('input', (e) => {
            const password = e.target.value;
            const requirements = document.getElementById('passwordRequirements').children;
            const bar = document.getElementById('passwordStrengthBar');
            const text = document.getElementById('passwordStrengthText');
            
            let strength = 0;
            
            // Check requirements
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);
            
            requirements[0].classList.toggle('valid', hasLength);
            requirements[1].classList.toggle('valid', hasUpper);
            requirements[2].classList.toggle('valid', hasLower);
            requirements[3].classList.toggle('valid', hasNumber);
            
            if (hasLength) strength++;
            if (hasUpper) strength++;
            if (hasLower) strength++;
            if (hasNumber) strength++;
            
            bar.className = 'bar-fill';
            if (strength <= 1) {
                bar.classList.add('weak');
                text.textContent = 'Yếu';
                text.style.color = '#ef4444';
            } else if (strength <= 3) {
                bar.classList.add('medium');
                text.textContent = 'Trung bình';
                text.style.color = '#f59e0b';
            } else {
                bar.classList.add('strong');
                text.textContent = 'Mạnh';
                text.style.color = '#22c55e';
            }
        });

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading-spinner"></span> Đang đăng nhập...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showAlert('loginSuccess', 'Đăng nhập thành công! Đang chuyển hướng...');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showAlert('loginError', data.error || 'Đăng nhập thất bại');
                }
            } catch (error) {
                showAlert('loginError', 'Lỗi kết nối. Vui lòng thử lại.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Register form
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('registerError', 'Mật khẩu xác nhận không khớp');
                return;
            }
            
            const btn = document.getElementById('registerBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading-spinner"></span> Đang đăng ký...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('registerFullName').value,
                        username: document.getElementById('registerUsername').value,
                        email: document.getElementById('registerEmail').value,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('registerSuccess', 'Đăng ký thành công! Vui lòng đăng nhập.');
                    
                    // Switch to login tab after 2 seconds
                    setTimeout(() => {
                        document.querySelector('.auth-tab[data-tab="login"]').click();
                        document.getElementById('loginUsername').value = document.getElementById('registerUsername').value;
                    }, 2000);
                } else {
                    showAlert('registerError', data.error || 'Đăng ký thất bại');
                }
            } catch (error) {
                showAlert('registerError', 'Lỗi kết nối. Vui lòng thử lại.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('auth_token');
        if (token) {
            fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/';
                }
            });
        }
    </script>
</body>
</html>
